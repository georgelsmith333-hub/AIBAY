name: Deploy AIBAY

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      frontend_hash: ${{ steps.hash.outputs.hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (frontend + backend)
        env:
          NODE_ENV: production
          VITE_API_URL: https://aibay-zpsa.onrender.com
          VITE_BASE_PATH: /AIBAY/
        run: npm run build

      - name: Add 404.html for SPA deep-link routing
        run: cp dist/public/index.html dist/public/404.html

      - name: Output build hash
        id: hash
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/public
          retention-days: 1

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/index.cjs
          retention-days: 1

  deploy-pages:
    name: Deploy → GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ needs.build.outputs.frontend_hash }}'

  deploy-render:
    name: Deploy → Render (pre-built)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist

      - name: Push pre-built backend to render-deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create an orphan branch with only the built file
          git fetch origin render-deploy 2>/dev/null || true
          git checkout --orphan render-deploy-new
          git rm -rf . --quiet || true

          mkdir -p dist
          cp dist/index.cjs dist/index.cjs 2>/dev/null || true

          # Create a minimal package.json so Render knows it's a Node app
          cat > package.json << 'EOF'
          { "name": "aibay-backend", "version": "1.0.0", "scripts": { "start": "node dist/index.cjs" } }
          EOF

          git add dist/index.cjs package.json
          git commit -m "deploy: pre-built backend ${{ needs.build.outputs.frontend_hash }}"
          git push origin HEAD:render-deploy --force

      - name: Notify Render via Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -s --fail "${{ secrets.RENDER_DEPLOY_HOOK }}" && echo "Render deploy triggered."
