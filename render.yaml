services:
  - type: web
    name: aibay
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aibay-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EBAY_APP_ID
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
    healthCheckPath: /api/health

databases:
  - name: aibay-db
    plan: free
    databaseName: aibay
    user: aibay
